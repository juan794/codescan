name: Semgrep SAST
on: [push, pull_request]
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install and Run Semgrep
        run: |
          python -m pip install --upgrade semgrep
          # --error forces the pipeline to fail if findings are discovered
          semgrep scan --error --config "p/default" --config "p/security-audit" --config "p/fastapi"
          
